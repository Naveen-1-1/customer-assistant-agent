<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer Agent Test</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    #chat { height: 65vh; overflow-y: auto; }
    .msg { max-width: 80%; white-space: pre-wrap; }
    .tool { font-size: .8rem; }
  </style>
</head>
<body class="bg-light">
  <nav class="navbar bg-white border-bottom mb-3">
    <div class="container-fluid"><span class="navbar-brand">Customer agent: user testing</span></div>
  </nav>

  <div class="container-fluid">
    <div class="row g-3">
      <!-- left: task, scenario, controls -->
      <div class="col-lg-4">
        <div class="card mb-3">
          <div class="card-body">
            <label for="task" class="form-label">Task</label>
            <select id="task" class="form-select mb-2"></select>
            <button id="start" class="btn btn-primary w-100">Start session</button>
          </div>
        </div>

        <div id="scenario" class="card mb-3 d-none">
          <div class="card-header">Your role (read before you start)</div>
          <div class="card-body small">
            <p><strong>Who you are:</strong> <span id="known"></span></p>
            <p><strong>What you want:</strong> <span id="reason"></span></p>
            <p><strong>What you don't know:</strong> <span id="unknown"></span></p>
            <p class="mb-0"><strong>How you act:</strong> <span id="persona"></span></p>
          </div>
        </div>

        <div class="form-check form-switch mb-3">
          <input class="form-check-input" type="checkbox" id="showTools">
          <label class="form-check-label" for="showTools">Show tool calls (off during user testing)</label>
        </div>

        <button id="end" class="btn btn-outline-danger w-100 mb-3" disabled>End session</button>
        <div id="result" class="alert d-none"></div>
      </div>

      <!-- right: chat -->
      <div class="col-lg-8">
        <div class="card">
          <div id="chat" class="card-body"></div>
          <div class="card-footer">
            <form id="form" class="input-group">
              <input id="input" class="form-control" placeholder="Type your message as the customer…" autocomplete="off" disabled>
              <button id="send" class="btn btn-primary" disabled>Send</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
