[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "customer-assistant-agent"
version = "0.1.0"
description = "Baseline agent and evaluation harness on the τ²-bench retail store"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "langchain-core>=1.4.7,<2",  # InMemoryRateLimiter
    # Exact pin: 1.82.7 and 1.82.8 on PyPI were compromised (March 2026). Check before bumping.
    "litellm==1.102.2",
    "fastapi>=0.142",
    "uvicorn[standard]>=0.35",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
]

[project.optional-dependencies]
dev = ["ruff>=0.13"]

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["."]

[tool.ruff.lint.per-file-ignores]
# τ²-bench's simulator guidelines, kept word for word.
"agent/evaluation/simulated_customer.py" = ["E501"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
